<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>緯度経度/極座標系</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        #three {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="three"></div>

    <!-- Instructions -->
    <div style="position: absolute; top: 10px; left: 10px; color: white; font-family: Arial, sans-serif; font-size: 14px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; max-width: 300px;">
        <h3 style="margin: 0 0 10px 0; color: #ffff00;">操作方法</h3>
        <p style="margin: 5px 0; line-height: 1.4;">
            <strong>マウス操作:</strong><br>
            • ドラッグ: 回転<br>
            • ホイール: ズーム<br>
            • 右ドラッグ: パン
        </p>
        <p style="margin: 5px 0; line-height: 1.4;">
            <strong>グリッドライン:</strong><br>
            • ホバー: 黄色でハイライト<br>
            • 経線クリック: 半球に切断<br>
            • 緯線クリック: 高緯度を切断
        </p>
        <p style="margin: 5px 0; line-height: 1.4;">
            <strong>キーボード:</strong><br>
            • Rキー: 地球をリセット
        </p>
    </div>

    <!-- License notice -->
    <div style="position: absolute; bottom: 10px; left: 10px; color: white; font-family: Arial, sans-serif; font-size: 12px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 3px;">
        Earth texture: Copyright © James Hastings-Trew<br>
        <a href="http://planetpixelemporium.com/earth.html" target="_blank" style="color: #ccc;">Planet Pixel Emporium</a>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for mouse interaction -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Main script -->
    <script type="module" src="main.js"></script>
</body>
</html>
